name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # pnpm-lock.yaml is lockfileVersion 6.0, which is pnpm 8.
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        # Covers app/app, which is what actually ships. A plain `next build` here
        # would treat app/ as the router directory and build the blog-starter
        # leftovers, which is not the tree Vercel deploys.
        run: pnpm exec tsc --noEmit

      - name: Check public assets
        run: node scripts/check-public-assets.mjs
